[workspace]
resolver = "2"
members = ["crates/cord_server"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
# The fuz Rust spine crates, as path deps to a sibling checkout of the fuz
# workspace (the crates aren't published yet).
fuz_actions = { path = "../private_fuz/crates/fuz_actions" }
fuz_auth = { path = "../private_fuz/crates/fuz_auth" }
fuz_db = { path = "../private_fuz/crates/fuz_db" }
fuz_http = { path = "../private_fuz/crates/fuz_http" }
fuz_realtime = { path = "../private_fuz/crates/fuz_realtime" }
fuz_sys = { path = "../private_fuz/crates/fuz_sys" }

# Async runtime + web framework.
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "sync", "fs", "signal", "time", "process", "io-util"] }
axum = { version = "0.8", features = ["ws"] }
# `ServiceExt::oneshot`, for driving a composed `Router` in-process without
# binding a socket (dev-only).
tower = "0.5"

# Logging.
tracing = "0.1"

# Serialization.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors.
thiserror = "2"

# DB.
deadpool-postgres = "0.14"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
# Enable lint groups (priority -1 so individual lints can override)
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Pedantic overrides
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
too_many_lines = "allow"

# Nursery overrides
significant_drop_tightening = "allow"

# Cargo overrides (private repos)
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"

# Restriction lints (panic points need explicit #[allow] with justification)
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
