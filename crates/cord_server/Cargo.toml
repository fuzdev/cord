[package]
name = "cord_server"
description = "the cord server (cordd): an API-only backend over the fuz Rust spine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "cordd"
path = "src/main.rs"

[dependencies]
# Spine crates.
fuz_actions.workspace = true
fuz_auth.workspace = true
fuz_cell.workspace = true
fuz_db.workspace = true
fuz_http.workspace = true
fuz_realtime.workspace = true
fuz_sys = { workspace = true, features = ["logging"] }

# Async runtime + web.
tokio.workspace = true
axum.workspace = true

# Logging. Subscriber init comes from `fuz_sys::logging` (feature-gated).
tracing.workspace = true

# Serialization.
serde.workspace = true
serde_json.workspace = true

# Errors.
thiserror.workspace = true

# DB.
deadpool-postgres.workspace = true

# Ids.
uuid.workspace = true

[dev-dependencies]
# `ServiceExt::oneshot` for the in-process router tests.
tower.workspace = true

[lints]
workspace = true
