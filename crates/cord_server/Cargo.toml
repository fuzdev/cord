[package]
name = "cord_server"
description = "the cord server (cordd): an API-only backend over the fuz Rust spine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "cordd"
path = "src/main.rs"

[dependencies]
# Spine crates.
fuz_actions.workspace = true
fuz_auth.workspace = true
fuz_cell.workspace = true
fuz_db.workspace = true
fuz_http.workspace = true
fuz_sys = { workspace = true, features = ["logging"] }

# Async runtime + web.
tokio.workspace = true
axum.workspace = true

# Logging. Subscriber init comes from `fuz_sys::logging` (feature-gated).
tracing.workspace = true

# Serialization.
serde.workspace = true
serde_json.workspace = true

# Errors.
thiserror.workspace = true

# DB.
deadpool-postgres.workspace = true

# Ids.
uuid.workspace = true

[dev-dependencies]
# Dev-only: the spine's shared Postgres-suite harness (`fuz_testing`'s
# `fresh_db`, `seed`, and the column-projection guard). A dev-dependency never
# reaches the `cordd` binary, and `cargo xtask check-release` walks runtime
# edges only.
fuz_testing.workspace = true
# `ServiceExt::oneshot` for the in-process router tests.
tower.workspace = true
# Re-declare fuz_http (already a normal dep) with the test-only
# `GatedRouter::into_router_for_testing`, so the router tests can drive the
# composed router in-process. Enabled from a dev-dependency it stays out of
# every build that compiles no tests; `cargo xtask check-release` refuses it on
# a normal edge.
fuz_http = { workspace = true, features = ["test_router_access"] }

[lints]
workspace = true
