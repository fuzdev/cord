[package]
name = "testing_cord_server"
description = "test-only cord server (testing_cordd): cordd with the fast hasher and the _testing_* actions; never shipped"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Test-only binary, never shipped. The `testing_` name prefix marks it
# unshippable and exempts it, by name, from `cargo xtask check-release`, which
# asserts the production `cordd` graph never reaches `fuz_testing` or
# `fuz_audit` (this crate is the only runtime dependent of `fuz_testing`;
# `cord_server` takes it as a dev-dependency for its database suites, an edge
# the audit ignores).
[[bin]]
name = "testing_cordd"
path = "src/main.rs"

[dependencies]
cord_server = { path = "../cord_server" }
fuz_testing.workspace = true
fuz_actions.workspace = true
fuz_auth.workspace = true
# `CELL_DROP_TABLES`, the reset's truncate.
fuz_cell.workspace = true
fuz_db.workspace = true
fuz_http.workspace = true
fuz_sys = { workspace = true, features = ["logging"] }
serde_json.workspace = true
tokio.workspace = true

[lints]
workspace = true
