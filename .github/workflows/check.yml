# Checks and builds the project. For more info:
# https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']
  # Allow manually re-running the check from the Actions tab.
  workflow_dispatch:

# Cancel a PR's in-progress run when a new commit supersedes it; let main-branch
# runs finish so every commit on main stays verified.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: the check only reads the repo.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: ['24.14']

    steps:
      # persist-credentials: false keeps the GITHUB_TOKEN out of .git/config, so a
      # compromised build dependency can't read it. If you add a step that pushes
      # via git (deploy, tag, generated commit), set this back to true or
      # authenticate that step explicitly.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npx @fuzdev/gro check --workspace --build --lint

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: cord_test
          POSTGRES_PASSWORD: cord_test
          POSTGRES_DB: cord_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # `FUZ_REF` and `PGLET_REF` are the `fuz` and `pglet` commits cord is
    # checked against: both checked out at `main`, so the three move together.
    env:
      FUZ_REF: main
      PGLET_REF: main

    defaults:
      run:
        working-directory: cord

    steps:
      # persist-credentials: false keeps the GITHUB_TOKEN out of .git/config (no step here pushes via git).
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: cord
          persist-credentials: false

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: fuzdev/fuz
          ref: ${{ env.FUZ_REF }}
          path: fuz
          persist-credentials: false

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: fuzdev/pglet
          ref: ${{ env.PGLET_REF }}
          path: pglet
          persist-credentials: false

      # The toolchain is pinned in rust-toolchain.toml, not `stable`: the
      # workspace runs `clippy::nursery` at warn and this job denies warnings,
      # so a floating toolchain would fail CI whenever a new Rust release adds a
      # nursery lint. Any rustup 1.28+ reads the file with no arguments, so skip
      # self-updating it. It runs in `cord/`, so it reads this repo's file; the
      # `fuz` and `pglet` path crates build under that same toolchain.
      - name: Install Rust
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain
          cargo --version

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: cord -> target

      # Every workspace package named, never `--all`: rustfmt follows path
      # dependencies, so `--all` would check the `fuz` checkout's files too.
      - name: Format
        run: cargo fmt -p cord_server -p testing_cord_server -p xtask --check

      # `--locked` holds the committed lockfile, which records the `fuz` and
      # `pglet` path crates with their versions and dependencies, so a version
      # bump or dependency change at `FUZ_REF` or `PGLET_REF` fails here until
      # `Cargo.lock` is updated.
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # The database tests run on in-process pglet (`fuz_testing::fresh_test_db`);
      # the Postgres-only and pglet-blocked ones stay ignored here.
      - name: Test
        run: cargo test --locked --workspace

      # The PostgreSQL leg. `--include-ignored`: every DB test, and the
      # Postgres-only and pglet-blocked ones beside them. Each test creates a
      # database of its own through this server and role and drops it after
      # (`fuz_testing::fresh_test_db`), so they run in parallel; the service's
      # user is a superuser, so it has `CREATEDB`. `cord_server` is the crate
      # with database tests.
      - name: Test (Postgres)
        env:
          FUZ_TEST_POSTGRES_URL: postgres://cord_test:cord_test@localhost:5432/cord_test
        run: cargo test --locked -p cord_server -- --include-ignored

      - name: Release dep-graph audit
        run: cargo xtask check-release

      # `--no-deps` keeps the `fuz` and `pglet` path crates out (their own CI
      # documents them).
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps
